<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Administrativo AFC</title>
    <style>
      :root { color-scheme: dark; --bg:#060606; --panel:#111; --panel-2:#171717; --text:#f5f5f5; --muted:#a0a0a0; --accent:#ff2e2e; --border:#2a2a2a; }
      * { box-sizing:border-box; }
      body { margin:0; font-family:Arial, Helvetica, sans-serif; background:linear-gradient(135deg,#060606 0%,#121212 100%); color:var(--text); }
      .shell { max-width:1320px; margin:0 auto; padding:24px; }
      .card { background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:20px; box-shadow:0 20px 40px rgba(0,0,0,.25); }
      .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
      .btn { border:0; padding:12px 16px; border-radius:999px; cursor:pointer; font-weight:700; }
      .btn-primary { background:var(--accent); color:#fff; }
      .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); margin-bottom:20px; }
      .metric { background:var(--panel-2); border:1px solid var(--border); border-radius:16px; padding:16px; }
      .metric .label { color:var(--muted); font-size:13px; margin-bottom:8px; text-transform:uppercase; letter-spacing:.16em; }
      .metric .value { font-size:24px; font-weight:700; }
      .list { width:100%; border-collapse:collapse; overflow:hidden; }
      .list th, .list td { padding:12px; border-bottom:1px solid var(--border); text-align:left; }
      .list th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.16em; }
      .pill { display:inline-block; padding:6px 10px; border-radius:999px; font-size:12px; font-weight:700; background:#202020; color:#fff; }
      .pill.ok { background:#1d5f33; }
      .pill.warn { background:#7a4a00; }
      .pill.bad { background:#7a1f1f; }
      .hidden { display:none; }
      form { display:grid; gap:10px; max-width:360px; }
      input { padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:#0c0c0c; color:#fff; }
      .auth-box { max-width:420px; margin:56px auto; }
      .small { color:var(--muted); font-size:13px; }
      @media (max-width: 680px) { .shell{padding:14px;} .topbar{flex-direction:column; align-items:flex-start; gap:10px;} }
    </style>
  </head>
  <body>
    <div class="shell" id="app"></div>
    <script type="module">
      const app = document.getElementById('app');
      const state = { authenticated: false, dashboard: null, pedidos: [], loading: true, error: '' };

      const getExportFilename = (response) => {
        const contentDisposition = response.headers.get('content-disposition') || '';
        const match = contentDisposition.match(/filename\*?=(?:UTF-8''|\")?([^\";]+)/i);
        if (match && match[1]) {
          return decodeURIComponent(match[1].replace(/\"/g, '').trim());
        }
        return `compradores-afc-${new Date().toISOString().slice(0, 10)}.xlsx`;
      };

      const downloadBlob = (blob, fileName) => {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      };

      const renderLogin = () => {
        app.innerHTML = `
          <div class="auth-box card">
            <h1 style="margin-top:0;">Painel administrativo</h1>
            <p class="small">Acesso restrito para consulta e acompanhamento das vendas.</p>
            <form id="loginForm">
              <input type="password" id="password" placeholder="Senha administrativa" required />
              <button class="btn btn-primary" type="submit">Entrar</button>
            </form>
            <p id="loginError" class="small" style="color:#ff9b9b; min-height:20px;"></p>
          </div>`;
        document.getElementById('loginForm').addEventListener('submit', async (event) => {
          event.preventDefault();
          const password = document.getElementById('password').value;
          const response = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
          });
          if (response.ok) {
            state.authenticated = true;
            renderDashboard();
            return;
          }
          const payload = await response.json().catch(() => ({}));
          document.getElementById('loginError').textContent = payload.error || 'Falha ao entrar.';
        });
      };

      const renderDashboard = async () => {
        app.innerHTML = '<div class="card"><p>Carregando painel...</p></div>';
        const response = await fetch('/api/admin/dashboard');
        if (!response.ok) {
          state.authenticated = false;
          renderLogin();
          return;
        }
        const payload = await response.json();
        state.dashboard = payload.dashboard || null;
        state.pedidos = payload.pedidos || [];
        app.innerHTML = `
          <div class="topbar">
            <div>
              <h1 style="margin:0;">Painel AFC Events</h1>
              <p class="small" style="margin:6px 0 0;">Consulta de pedidos, ingressos e status de e-mail.</p>
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              <button id="exportBtn" class="btn" style="background:#202020; color:#fff;">Exportar compradores</button>
              <button id="logoutBtn" class="btn btn-primary">Sair</button>
            </div>
          </div>
          <p id="exportError" class="small" style="color:#ff9b9b; min-height:20px; margin:0 0 16px;"></p>
          <div class="grid">
            <div class="metric"><div class="label">Total de pedidos</div><div class="value">${state.dashboard?.totalPedidos ?? 0}</div></div>
            <div class="metric"><div class="label">Pagos</div><div class="value">${state.dashboard?.pedidosPagos ?? 0}</div></div>
            <div class="metric"><div class="label">Pendentes</div><div class="value">${state.dashboard?.pedidosPendentes ?? 0}</div></div>
            <div class="metric"><div class="label">Cancelados</div><div class="value">${state.dashboard?.pedidosCancelados ?? 0}</div></div>
            <div class="metric"><div class="label">Ingressos emitidos</div><div class="value">${state.dashboard?.totalIngressos ?? 0}</div></div>
            <div class="metric"><div class="label">Valor vendido</div><div class="value">R$ ${Number(state.dashboard?.valorTotalVendido || 0).toFixed(2)}</div></div>
            <div class="metric"><div class="label">E-mails enviados</div><div class="value">${state.dashboard?.emailsEnviados ?? 0}</div></div>
            <div class="metric"><div class="label">Falhas</div><div class="value">${state.dashboard?.emailsFalhas ?? 0}</div></div>
            <div class="metric"><div class="label">PPV pagos</div><div class="value">${state.dashboard?.ppvPagos ?? 0}</div></div>
            <div class="metric"><div class="label">PPV transmissão pendente</div><div class="value">${state.dashboard?.ppvTransmissaoPendente ?? 0}</div></div>
          </div>
          <div class="card" style="margin-bottom:20px;">
            <h2 style="margin-top:0;">Reenviar ingressos</h2>
            <p class="small" style="margin:0 0 16px;">Use após corrigir o e-mail de um comprador no Supabase. Reenvia os ingressos já emitidos para o e-mail atual do pedido.</p>
            <form id="resendForm" style="display:grid; gap:12px; max-width:640px;">
              <label class="small" style="display:grid; gap:6px;">
                E-mail do comprador
                <input type="email" id="resendEmail" placeholder="cliente@email.com" required />
              </label>
              <label class="small" style="display:grid; gap:6px;">
                Código do pedido (opcional)
                <input type="text" id="resendCodigo" placeholder="AFC-DDB90F82" />
              </label>
              <button class="btn btn-primary" type="submit" id="resendBtn">Reenviar ingressos</button>
            </form>
            <p id="resendResult" class="small" style="min-height:20px; margin:12px 0 0;"></p>
          </div>
          <div class="card" style="margin-bottom:20px;">
            <h2 style="margin-top:0;">Lembrete em massa (Arquibancada / VIP)</h2>
            <p class="small" style="margin:0 0 16px;">Reenvia os mesmos ingressos e QR Codes para todos os compradores pagos de ingresso físico, com uma mensagem de destaque no topo do e-mail.</p>
            <form id="massResendForm" style="display:grid; gap:12px; max-width:640px;">
              <label class="small" style="display:grid; gap:6px;">
                Mensagem de destaque
                <textarea id="massResendMessage" rows="3" required maxlength="500">Faltam apenas 10 dias para o Avalanche Fight Championship! Mostre seus ingressos na portaria na entrada do evento.</textarea>
              </label>
              <label class="small" style="display:grid; gap:6px;">
                Tipo de ingresso
                <select id="massResendType">
                  <option value="">Arquibancada e VIP</option>
                  <option value="arquibancada">Somente Arquibancada</option>
                  <option value="vip">Somente Cadeira VIP</option>
                </select>
              </label>
              <button class="btn btn-primary" type="submit" id="massResendBtn">Reenviar ingressos para todos</button>
            </form>
            <p id="massResendResult" class="small" style="min-height:20px; margin:12px 0 0;"></p>
          </div>
          <div class="card" style="margin-bottom:20px;">
            <h2 style="margin-top:0;">Pay-Per-View</h2>
            <p class="small" style="margin:0 0 16px;">Dispare o e-mail com o link da transmissão para compradores aprovados do Pay-Per-View.</p>
            <form id="ppvForm" style="display:grid; gap:12px; max-width:640px;">
              <label class="small" style="display:grid; gap:6px;">
                Link da transmissão (HTTPS)
                <input type="url" id="ppvLink" placeholder="https://youtube.com/live/..." required />
              </label>
              <label class="small" style="display:flex; align-items:center; gap:8px;">
                <input type="checkbox" id="ppvReenviar" />
                Reenviar para todos (inclui quem já recebeu)
              </label>
              <button class="btn btn-primary" type="submit" id="ppvSendBtn">Enviar e-mail para compradores</button>
            </form>
            <p id="ppvResult" class="small" style="min-height:20px; margin:12px 0 0;"></p>
          </div>
          <div class="card">
            <table class="list">
              <thead>
                <tr><th>Data</th><th>Comprador</th><th>Tipo</th><th>E-mail</th><th>Qtd.</th><th>Valor</th><th>Status</th><th>E-mail</th><th>Transmissão</th></tr>
              </thead>
              <tbody>
                ${(state.pedidos || []).map((pedido) => `
                  <tr>
                    <td>${new Date(pedido.created_at).toLocaleString('pt-BR')}</td>
                    <td>${pedido.nome}</td>
                    <td>${pedido.tipo_ingresso || '-'}</td>
                    <td>${pedido.email}</td>
                    <td>${pedido.quantidade}</td>
                    <td>R$ ${Number(pedido.valor_total || 0).toFixed(2)}</td>
                    <td><span class="pill">${pedido.status_pagamento}</span></td>
                    <td><span class="pill ${pedido.status_email === 'enviado' ? 'ok' : pedido.status_email === 'falha' ? 'bad' : 'warn'}">${pedido.status_email}</span></td>
                    <td>${pedido.tipo_ingresso === 'pay-per-view'
                      ? `<span class="pill ${pedido.transmissao_enviada ? 'ok' : 'warn'}">${pedido.transmissao_enviada ? 'enviada' : 'pendente'}</span>`
                      : '-'}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>`;
        document.getElementById('exportBtn').addEventListener('click', async () => {
          const exportButton = document.getElementById('exportBtn');
          const exportError = document.getElementById('exportError');
          const originalText = exportButton.textContent;

          exportButton.disabled = true;
          exportButton.textContent = 'Exportando...';
          exportError.textContent = '';

          try {
            const exportResponse = await fetch('/api/admin/exportar-compradores');
            if (exportResponse.status === 401) {
              state.authenticated = false;
              renderLogin();
              return;
            }

            if (!exportResponse.ok) {
              const payload = await exportResponse.json().catch(() => ({}));
              throw new Error(payload.error || 'Não foi possível exportar os compradores agora.');
            }

            const fileName = getExportFilename(exportResponse);
            const blob = await exportResponse.blob();
            downloadBlob(blob, fileName);
          } catch (error) {
            exportError.textContent = error?.message || 'Não foi possível exportar os compradores agora.';
          } finally {
            if (document.getElementById('exportBtn')) {
              exportButton.disabled = false;
              exportButton.textContent = originalText;
            }
          }
        });
        document.getElementById('logoutBtn').addEventListener('click', async () => {
          await fetch('/api/admin/logout', { method: 'POST' });
          state.authenticated = false;
          renderLogin();
        });
        document.getElementById('resendForm').addEventListener('submit', async (event) => {
          event.preventDefault();
          const sendButton = document.getElementById('resendBtn');
          const resultBox = document.getElementById('resendResult');
          const email = document.getElementById('resendEmail').value.trim();
          const codigoPedido = document.getElementById('resendCodigo').value.trim();
          const originalText = sendButton.textContent;

          sendButton.disabled = true;
          sendButton.textContent = 'Enviando...';
          resultBox.style.color = 'var(--muted)';
          resultBox.textContent = '';

          try {
            const response = await fetch('/api/admin/pedidos/reenviar-email', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, codigoPedido: codigoPedido || undefined })
            });
            const payload = await response.json().catch(() => ({}));

            if (response.status === 401) {
              state.authenticated = false;
              renderLogin();
              return;
            }

            if (!response.ok) {
              throw new Error(payload.error || 'Falha ao reenviar ingressos.');
            }

            resultBox.style.color = '#b7f5c6';
            resultBox.textContent = `Enviado para ${payload.email} • Pedido ${payload.codigoPedido} • ${payload.quantidadeIngressos} ingresso(s)`;
            await renderDashboard();
          } catch (error) {
            resultBox.style.color = '#ff9b9b';
            resultBox.textContent = error?.message || 'Falha ao reenviar ingressos.';
          } finally {
            if (document.getElementById('resendBtn')) {
              sendButton.disabled = false;
              sendButton.textContent = originalText;
            }
          }
        });
        document.getElementById('massResendForm').addEventListener('submit', async (event) => {
          event.preventDefault();
          const sendButton = document.getElementById('massResendBtn');
          const resultBox = document.getElementById('massResendResult');
          const mensagemDestaque = document.getElementById('massResendMessage').value.trim();
          const tipoIngresso = document.getElementById('massResendType').value.trim();
          const originalText = sendButton.textContent;

          if (!window.confirm('Confirma o reenvio dos ingressos para todos os compradores selecionados?')) {
            return;
          }

          sendButton.disabled = true;
          sendButton.textContent = 'Enviando...';
          resultBox.style.color = 'var(--muted)';
          resultBox.textContent = '';

          try {
            const response = await fetch('/api/admin/pedidos/reenviar-email', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ mensagemDestaque, tipoIngresso: tipoIngresso || undefined })
            });
            const payload = await response.json().catch(() => ({}));

            if (response.status === 401) {
              state.authenticated = false;
              renderLogin();
              return;
            }

            if (!response.ok) {
              throw new Error(payload.error || 'Falha ao reenviar ingressos em massa.');
            }

            resultBox.style.color = '#b7f5c6';
            resultBox.textContent = `Total: ${payload.total ?? 0} • Enviados: ${payload.enviados ?? 0} • Falhas: ${payload.falhas ?? 0}`;
            await renderDashboard();
          } catch (error) {
            resultBox.style.color = '#ff9b9b';
            resultBox.textContent = error?.message || 'Falha ao reenviar ingressos em massa.';
          } finally {
            if (document.getElementById('massResendBtn')) {
              sendButton.disabled = false;
              sendButton.textContent = originalText;
            }
          }
        });
        document.getElementById('ppvForm').addEventListener('submit', async (event) => {
          event.preventDefault();
          const sendButton = document.getElementById('ppvSendBtn');
          const resultBox = document.getElementById('ppvResult');
          const link = document.getElementById('ppvLink').value.trim();
          const reenviar = document.getElementById('ppvReenviar').checked;
          const originalText = sendButton.textContent;

          sendButton.disabled = true;
          sendButton.textContent = 'Enviando...';
          resultBox.style.color = 'var(--muted)';
          resultBox.textContent = '';

          try {
            const response = await fetch('/api/admin/pay-per-view/enviar-transmissao', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ link, reenviar })
            });
            const payload = await response.json().catch(() => ({}));

            if (response.status === 401) {
              state.authenticated = false;
              renderLogin();
              return;
            }

            if (!response.ok) {
              throw new Error(payload.error || 'Falha ao enviar e-mails de transmissão.');
            }

            resultBox.style.color = '#b7f5c6';
            resultBox.textContent = `Total: ${payload.total ?? 0} • Enviados: ${payload.enviados ?? 0} • Falhas: ${payload.falhas ?? 0}`;
            await renderDashboard();
          } catch (error) {
            resultBox.style.color = '#ff9b9b';
            resultBox.textContent = error?.message || 'Falha ao enviar e-mails de transmissão.';
          } finally {
            if (document.getElementById('ppvSendBtn')) {
              sendButton.disabled = false;
              sendButton.textContent = originalText;
            }
          }
        });
      };

      (async () => {
        const response = await fetch('/api/admin/login');
        state.authenticated = response.ok;
        if (state.authenticated) {
          renderDashboard();
          return;
        }
        renderLogin();
      })();
    </script>
  </body>
</html>
